name: Windows installer

on:
  pull_request:
    paths:
      - install.ps1
      - tests/install-windows.ps1
      - .github/workflows/windows-installer.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - tests/install-windows.ps1
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check locked executable replacement
        shell: powershell
        run: ./tests/install-windows.ps1
